<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - ABB Breaker Selector</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}header{background:#111827;color:#fff;padding:18px 24px}main{max-width:1400px;margin:20px auto;padding:0 16px}.card{background:#fff;padding:18px;border-radius:12px;margin-bottom:16px;border:1px solid #e5e7eb}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{font-size:12px;font-weight:700;display:block}.field input,.field select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:8px;margin-top:4px}.btn{padding:9px 13px;border:0;border-radius:8px;font-weight:700;cursor:pointer}.primary{background:#e31b23;color:#fff}.muted{background:#e5e7eb}.danger{background:#fee2e2}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #e5e7eb;white-space:nowrap;text-align:left}th{background:#f8fafc}.login{max-width:420px;margin:80px auto}.hidden{display:none}.msg{padding:8px;margin:8px 0;border-radius:8px;background:#ecfdf5}</style></head><body><header><b>ABB Breaker Selector — Admin</b> · <a href="/" style="color:#fff">กลับหน้าหลัก</a></header><main><section id="login" class="card login"><h2>Admin Login</h2><input id="password" type="password" placeholder="Password" style="width:100%;padding:10px;box-sizing:border-box"><button class="btn primary" onclick="login()" style="margin-top:10px">เข้าสู่ระบบ</button><p id="loginmsg"></p></section><section id="app" class="hidden"><div class="card"><h2>เพิ่ม / แก้ไขสินค้า</h2><input type="hidden" id="id"><div class="grid"><div class="field"><label>Category</label><input id="category" value="MCCB"></div><div class="field"><label>Series</label><input id="series"></div><div class="field"><label>Model</label><input id="model"></div><div class="field"><label>Current (A)</label><input id="current" type="number"></div><div class="field"><label>Poles</label><input id="poles" type="number"></div><div class="field"><label>Voltage (V)</label><input id="voltage" type="number" value="415"></div><div class="field"><label>Icu (kA)</label><input id="icu" type="number"></div><div class="field"><label>Ics (%)</label><input id="ics" type="number" value="100"></div><div class="field"><label>Trip Unit</label><input id="trip"></div><div class="field"><label>Version</label><input id="version"></div><div class="field"><label>Order Code</label><input id="ordercode"></div><div class="field"><label>ราคา (บาท)</label><input id="price" type="number"></div></div><p><button class="btn primary" onclick="save()">บันทึก</button> <button class="btn muted" onclick="clearForm()">ล้างฟอร์ม</button></p><div id="msg"></div></div><div class="card"><h2>สินค้าในฐานข้อมูล <span id="count"></span></h2><p><button class="btn muted" onclick="loadProducts()">รีเฟรช</button></p><div class="table"><table><thead><tr><th>Model</th><th>Series</th><th>A</th><th>Icu</th><th>Ics</th><th>Trip</th><th>Price</th><th>Active</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>let token='';let DATA=[];function login(){fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadProducts()}).catch(e=>document.getElementById('loginmsg').textContent=e.message)}async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+token};return fetch(url,opt)}async function loadProducts(){DATA=await api('/api/products?all=1').then(r=>r.json());document.getElementById('count').textContent='('+DATA.length+')';document.getElementById('rows').innerHTML=DATA.map((x,i)=>`<tr><td>${x.model}</td><td>${x.series}</td><td>${x.current}</td><td>${x.icu}</td><td>${x.ics}</td><td>${x.trip}</td><td>${x.price??''}</td><td>${x.active!==false?'Yes':'No'}</td><td><button class="btn muted" onclick="edit(${i})">แก้</button> <button class="btn danger" onclick="toggle(${i})">${x.active!==false?'ปิด':'เปิด'}</button></td></tr>`).join('')}function edit(i){let x=DATA[i];for(let k of ['id','category','series','model','current','poles','voltage','icu','ics','trip','version','ordercode','price'])document.getElementById(k).value=x[k]??'';scrollTo(0,0)}function clearForm(){['id','series','model','current','poles','icu','trip','version','ordercode','price'].forEach(k=>document.getElementById(k).value='');document.getElementById('category').value='MCCB';document.getElementById('voltage').value='415';document.getElementById('ics').value='100'}async function save(){let obj={};for(let k of ['id','category','series','model','current','poles','voltage','icu','ics','trip','version','ordercode','price']){let v=document.getElementById(k).value;if(['current','poles','voltage','icu','ics','price'].includes(k)&&v!=='')v=Number(v);obj[k]=v}if(!obj.id)delete obj.id;let r=await api('/api/products',{method:obj.id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});let d=await r.json();document.getElementById('msg').textContent=r.ok?'บันทึกแล้ว':'ผิดพลาด: '+(d.error||'unknown');if(r.ok){clearForm();loadProducts()}}async function toggle(i){let x=DATA[i];let r=await api('/api/products/'+x.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:x.active===false})});if(r.ok)loadProducts()} </script></body></html>
