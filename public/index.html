<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABB Breaker Selector</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f8;color:#172033}header{background:#111827;color:white;padding:22px 28px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:22px}header small{opacity:.7}.wrap{max-width:1400px;margin:24px auto;padding:0 18px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 3px 12px #0000000b}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#4b5563}.field input,.field select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:white}.actions{display:flex;gap:10px;margin-top:14px}.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer}.primary{background:#e31b23;color:white}.muted{background:#eef1f4;color:#374151}.summary{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#f1f5f9;border-radius:999px;padding:7px 11px;font-size:13px}.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rec{border:1px solid #e5e7eb;border-radius:12px;padding:15px}.rec h3{margin:8px 0 4px}.price{font-weight:800;font-size:18px;margin-top:10px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e7eb;white-space:nowrap}th{background:#f8fafc;position:sticky;top:0}.badge{display:inline-block;padding:4px 7px;border-radius:6px;background:#eef2ff;font-size:11px}.adminlink{color:white;text-decoration:none;background:#374151;padding:8px 12px;border-radius:8px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.recs{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}header{padding:16px}.wrap{margin:14px auto}}
</style></head><body><header><div><h1>ABB Breaker Selector</h1><small>Product & price selection system</small></div><a class="adminlink" href="/admin">Admin</a></header><main class="wrap"><section class="card"><h2>เลือกเบรกเกอร์</h2><div class="grid"><div class="field"><label>ประเภท</label><select id="category"><option value="any">ทั้งหมด</option><option>MCCB</option><option>ACB</option></select></div><div class="field"><label>กระแสขั้นต่ำ (A)</label><input id="current" type="number" min="0" placeholder="เช่น 400"></div><div class="field"><label>แรงดัน</label><select id="voltage"><option value="415">415 V</option></select></div><div class="field"><label>จำนวน Pole</label><select id="poles"><option value="any">ทั้งหมด</option><option value="1">1P</option><option value="2">2P</option><option value="3" selected>3P</option><option value="4">4P</option></select></div><div class="field"><label>Trip Unit</label><select id="trip"><option value="any">ทั้งหมด</option><option value="Thermal-magnetic">Thermal-magnetic</option><option value="Ekip Dip - LI">Ekip Dip - LI</option><option value="Ekip Dip - LSIG">Ekip Dip - LSIG</option><option value="Ekip Touch - LI">Ekip Touch - LI</option><option value="Ekip Touch - LSIG">Ekip Touch - LSIG</option></select></div><div class="field"><label>Icu ขั้นต่ำ (kA)</label><input id="icu" type="number" min="0" placeholder="เช่น 36"></div><div class="field"><label>Ics ขั้นต่ำ (%)</label><input id="ics" type="number" min="0" max="100" value="0"></div><div class="field"><label>งบสูงสุด (บาท)</label><input id="budget" type="number" min="0" placeholder="ไม่จำกัด"></div><div class="field"><label>เรียงตาม</label><select id="sort"><option value="price">ราคาต่ำ → สูง</option><option value="current">Current ต่ำ → สูง</option><option value="icu">Icu สูง → ต่ำ</option></select></div></div><div class="actions"><button class="btn primary" onclick="search()">ค้นหา</button><button class="btn muted" onclick="resetForm()">รีเซ็ต</button></div></section><section class="card"><div class="summary" id="summary"></div></section><section id="recommendations" class="recs"></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Type</th><th>Model / Series</th><th>Current</th><th>Poles</th><th>Icu</th><th>Ics</th><th>Trip</th><th>Version</th><th>Order Code</th><th>ราคา</th></tr></thead><tbody id="results"></tbody></table></div></section></main><script>
let DATA=[];const money=n=>n==null?'—':new Intl.NumberFormat('th-TH').format(n)+' ฿';
async function load(){DATA=await fetch('/api/products').then(r=>r.json());search()}function val(id){return document.getElementById(id).value}function search(){const f={current:+val('current')||0,voltage:+val('voltage'),poles:val('poles'),category:val('category'),trip:val('trip'),icu:+val('icu')||0,ics:+val('ics')||0,budget:val('budget')===''?Infinity:+val('budget'),sort:val('sort')};let rows=DATA.filter(x=>x.active!==false&&x.current>=f.current&&x.voltage===f.voltage&&(f.poles==='any'||x.poles===+f.poles)&&(f.category==='any'||x.category===f.category)&&(f.trip==='any'||x.trip===f.trip)&&x.icu>=f.icu&&x.ics>=f.ics&&(x.price==null||x.price<=f.budget));rows.sort((a,b)=>f.sort==='price'?(a.price??Infinity)-(b.price??Infinity):f.sort==='current'?a.current-b.current:b.icu-a.icu||a.price-b.price);document.getElementById('summary').innerHTML=`<span class="pill"><b>${rows.length}</b> รายการ</span><span class="pill">Current ≥ ${f.current} A</span><span class="pill">Icu ≥ ${f.icu} kA</span><span class="pill">Ics ≥ ${f.ics}%</span>`;document.getElementById('recommendations').innerHTML=rows.slice(0,3).map((x,i)=>`<div class="rec"><span class="badge">${i===0?'BEST MATCH':x.category}</span><h3>${x.model}</h3><div>${x.series} · ${x.current.toLocaleString()} A · ${x.poles}P</div><div>Icu ${x.icu} kA · Ics ${x.ics}%</div><div class="price">${money(x.price)}</div></div>`).join('');document.getElementById('results').innerHTML=rows.map(x=>`<tr><td><span class="badge">${x.category}</span></td><td><b>${x.model}</b><br><small>${x.series}</small></td><td>${x.current.toLocaleString()} A</td><td>${x.poles}P</td><td>${x.icu} kA</td><td>${x.ics}%</td><td>${x.trip}</td><td>${x.version||'—'}</td><td>${x.ordercode||'—'}</td><td><b>${money(x.price)}</b></td></tr>`).join('')||'<tr><td colspan="10">ไม่พบรายการ</td></tr>'}function resetForm(){['current','icu','budget'].forEach(id=>document.getElementById(id).value='');document.getElementById('category').value='any';document.getElementById('voltage').value='415';document.getElementById('poles').value='3';document.getElementById('trip').value='any';document.getElementById('ics').value='0';document.getElementById('sort').value='price';search()}load();
</script></body></html>
